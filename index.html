<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070707">
<title>Dreamcore — Operations</title>
<style>
:root{color-scheme:dark;--bg:#070707;--fg:#f1f0ec;--muted:#8b8a84;--line:#34332d;--gold:#e6ca22;--red:#ff8989}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
.shell{width:min(880px,calc(100% - 48px));margin:25px auto}
header{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:13px}
.mark{width:33px;height:33px;border:1px solid #71651b;color:var(--gold);display:grid;place-items:center;font-size:9px;font-weight:700}
.brand{padding-top:4px;font-size:11px;letter-spacing:2px;font-weight:700}
.brand small{display:block;color:#77736a;font-size:7px;letter-spacing:2px;margin-top:6px;font-weight:400}
main{width:min(610px,100%);margin:48px auto 0}
.kicker{font-size:8px;letter-spacing:2px;color:#8b8b83;margin-bottom:12px}
h1{font-size:52px;letter-spacing:-3px;margin:0 0 13px;font-weight:600}
.intro{font-size:12px;color:#aaa9a2;line-height:1.7;margin:0 0 22px}
label{display:block;font-size:8px;letter-spacing:1.5px;color:#a5a39a;margin:0 0 7px}
input{width:100%;height:46px;border:0;border-bottom:1px solid #55534c;background:transparent;color:#fff;font-size:14px;padding:0;outline:none;border-radius:0}
input:focus{border-bottom:2px solid var(--gold)}
.field{margin-bottom:17px}
button{width:100%;height:43px;margin-top:3px;background:transparent;border:0;border-top:1px solid var(--gold);color:var(--gold);text-align:left;font-weight:700;font-size:9px;letter-spacing:1.4px;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
#message{font-size:11px;line-height:1.6;color:var(--red);margin-top:14px;min-height:18px}
#dashboard{display:none;margin-top:34px;border-top:1px solid var(--line);padding-top:20px}
#dashboard h2{font-size:25px;margin:0 0 10px}
#dashboard p{color:var(--muted);font-size:12px}
#signout{margin-top:25px}
@media(max-width:520px){.shell{width:calc(100% - 36px)}main{margin-top:52px}h1{font-size:45px}}
</style>
</head>
<body>
<div class="shell">
<header>
  <div class="mark">ATC</div>
  <div class="brand">DREAMCORE<small>AIR TRAFFIC CONTROL</small></div>
</header>

<main>
  <section id="loginPanel">
    <div class="kicker">AUTHORISED ATC ACCESS</div>
    <h1>Operations.</h1>
    <p class="intro">Sign in with your ATC username. Passenger accounts do not have access to this console.</p>

    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="username">USERNAME</label>
        <input id="username" name="atc-user" type="text" value=""
          placeholder="Enter username" minlength="3" maxlength="20"
          autocomplete="off" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="password">PASSWORD</label>
        <input id="password" name="atc-pass" type="password" value=""
          placeholder="Enter password" autocomplete="new-password" required>
      </div>
      <button id="submitBtn" type="submit">SIGN IN →</button>
    </form>
    <div id="message" role="status" aria-live="polite"></div>
  </section>

  <section id="dashboard">
    <div class="kicker">ACCESS VERIFIED</div>
    <h2>Welcome to Operations.</h2>
    <p id="roleLine">Your ATC session is active.</p>
    <p id="userLine"></p>
    <button id="signout" type="button">SIGN OUT →</button>
  </section>
</main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithCustomToken, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

const firebaseConfig = {
  apiKey: "AIzaSyCtt1k2EFdJXEwCLo2jZsGEf2742fHZrzk",
  authDomain: "flyo-r3vxy.firebaseapp.com",
  projectId: "flyo-r3vxy",
  storageBucket: "flyo-r3vxy.firebasestorage.app",
  messagingSenderId: "651442899138",
  appId: "1:651442899138:web:699fef2737003088ee135b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const functions = getFunctions(app, "asia-south1");
const loginWithUsername = httpsCallable(functions, "loginAtcWithUsername");

const form = document.getElementById("loginForm");
const usernameInput = document.getElementById("username");
const passwordInput = document.getElementById("password");
const submitBtn = document.getElementById("submitBtn");
const message = document.getElementById("message");
const loginPanel = document.getElementById("loginPanel");
const dashboard = document.getElementById("dashboard");

function showError(text) {
  message.textContent = text;
}
function friendlyError(error) {
  const code = error?.code || "";
  if (code.includes("unauthenticated")) return "Incorrect username or password.";
  if (code.includes("permission-denied")) return "This account is not authorised for ATC access.";
  if (code.includes("unavailable") || code.includes("not-found")) return "ATC authentication service is not deployed or is unavailable.";
  return error?.message || "Unable to sign in. Please try again.";
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const username = usernameInput.value.trim().toLowerCase();
  const password = passwordInput.value;
  if (!username || !password) return showError("Enter your username and password.");

  submitBtn.disabled = true;
  submitBtn.textContent = "VERIFYING…";
  showError("");

  try {
    const result = await loginWithUsername({ username, password });
    const token = result?.data?.token;
    if (!token) throw new Error("Authentication server did not return a token.");
    await signInWithCustomToken(auth, token);
    passwordInput.value = "";
  } catch (error) {
    console.error("Dreamcore ATC login failed:", error);
    showError(friendlyError(error));
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "SIGN IN →";
  }
});

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    dashboard.style.display = "none";
    loginPanel.style.display = "block";
    usernameInput.value = "";
    passwordInput.value = "";
    return;
  }
  try {
    const token = await user.getIdTokenResult(true);
    const role = token.claims.atcRole;
    if (!["root", "controller"].includes(role)) {
      await signOut(auth);
      showError("This account is not authorised for ATC access.");
      return;
    }
    loginPanel.style.display = "none";
    dashboard.style.display = "block";
    document.getElementById("roleLine").textContent =
      role === "root" ? "Root controller access verified." : "Controller access verified.";
    document.getElementById("userLine").textContent = "Your secure ATC session is active.";
  } catch (error) {
    await signOut(auth);
    showError(friendlyError(error));
  }
});

document.getElementById("signout").addEventListener("click", async () => {
  await signOut(auth);
  showError("");
});
</script>
</body>
</html>
